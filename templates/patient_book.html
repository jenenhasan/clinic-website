{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <h2>Book an Appointment</h2>
    
    <form method="POST" action="{{ url_for('patient_book') }}">
        <!-- COMPLETELY REMOVE THIS LINE -->
        <!-- Do not have any csrf_token reference -->
        
        <div class="form-group">
            <label for="service_id">Service</label>
            <select name="service_id" id="service_id" class="form-control" required>
                <option value="">Select a service</option>
                {% for service in CONFIG.services %}
                <option value="{{ service.id }}" {% if form and form.get('service_id') == service.id %}selected{% endif %}>
                    {{ get_text(service.name) }} - {{ service.price }}
                </option>
                {% endfor %}
            </select>
        </div>
        
        <div class="form-group">
            <label for="date">Date</label>
            <input type="date" name="date" id="date" class="form-control" 
                   value="{{ form.get('date', '') if form else '' }}" required>
        </div>
        
        <div class="form-group">
            <label for="time">Time</label>
            <select name="time" id="time" class="form-control" required>
                <option value="">Select a time</option>
                {% for time_slot in TIME_SLOTS %}
                <option value="{{ time_slot }}" {% if form and form.get('time') == time_slot %}selected{% endif %}>
                    {{ time_slot }}
                </option>
                {% endfor %}
            </select>
        </div>
        
        <div class="form-group">
            <label for="notes">Additional Notes</label>
            <textarea name="notes" id="notes" class="form-control" rows="3">{{ form.get('notes', '') if form else '' }}</textarea>
        </div>
        
        <button type="submit" class="btn btn-primary">Book Appointment</button>
    </form>
</div>
{% endblock %}
