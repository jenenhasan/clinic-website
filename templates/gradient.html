<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Background</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .ui {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 10;
    }
    .btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.7);
      padding: 9px 20px;
      border-radius: 40px;
      font-size: 12px;
      font-family: system-ui, sans-serif;
      letter-spacing: 0.08em;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
      text-transform: uppercase;
    }
    .btn:hover {
      background: rgba(255,255,255,0.15);
      color: #fff;
      border-color: rgba(255,255,255,0.3);
    }
    .btn.active {
      background: rgba(30, 90, 200, 0.4);
      border-color: rgba(80, 140, 255, 0.5);
      color: #fff;
    }
    .temp-wrap {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 10;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 40px;
      padding: 8px 18px;
      backdrop-filter: blur(10px);
    }
    .temp-label {
      font-size: 10px;
      font-family: system-ui, sans-serif;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
      white-space: nowrap;
    }
    .temp-label.cool { color: rgba(100, 180, 255, 0.7); }
    .temp-label.warm { color: rgba(200, 220, 255, 0.7); }
    #temp-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 140px;
      height: 3px;
      border-radius: 2px;
      background: linear-gradient(to right, #1a0a4a, #1a3a8a, #e8f4ff);
      outline: none;
      cursor: pointer;
    }
    #temp-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 6px rgba(100,160,255,0.8);
      cursor: pointer;
    }
    #temp-slider::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      border: none;
      box-shadow: 0 0 6px rgba(100,160,255,0.8);
      cursor: pointer;
    }
    
    /* Overlay text on top of gradient */
    .overlay-text {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 5;
        text-align: center;

        font-family: 'Georgia', serif;
        pointer-events: none;
    }
    .overlay-text h1 {
        font-size: 3.5rem;
        color: rgba(255,255,255,0.95);
        text-shadow: 0 4px 30px rgba(0,0,0,0.5);
        margin-bottom: 12px;
        letter-spacing: 2px;
    }
    .overlay-text p {
        font-size: 1.2rem;
        color: rgba(255,255,255,0.6);
        text-shadow: 0 2px 20px rgba(0,0,0,0.5);
        letter-spacing: 1px;
    }
    .back-link {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 10;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.15);
        color: rgba(255,255,255,0.7);
        padding: 8px 18px;
        border-radius: 40px;
        font-size: 12px;
        font-family: system-ui, sans-serif;
        text-decoration: none;
        backdrop-filter: blur(10px);
        transition: all 0.3s ease;
        pointer-events: all;
    }
    .back-link:hover {
        background: rgba(255,255,255,0.15);
        color: #fff;
        border-color: rgba(255,255,255,0.3);
    }
    @media (max-width: 768px) {
        .overlay-text h1 { font-size: 2rem; }

        .ui { bottom: 16px; gap: 8px; flex-wrap: wrap; justify-content: center; }
        .btn { padding: 6px 14px; font-size: 10px; }
        .temp-wrap { bottom: 70px; padding: 6px 14px; }
        #temp-slider { width: 80px; }

</head>
<body>

<!-- Back Link -->
<a href="{{ url_for('index') }}" class="back-link">← Back to Home</a>

<!-- Overlay Text -->
<div class="overlay-text">
    <h1>Marsh Family Practice</h1>
    <p>Exceptional Family Care, Right in Your Community</p>
</div>

<!-- Canvas for the gradient -->
<canvas id="c"></canvas>

<!-- Controls -->
<div class="temp-wrap">
    <span class="temp-label cool">Indigo</span>
    <input type="range" id="temp-slider" min="0" max="100" value="50">
    <span class="temp-label warm">Ice</span>
</div>
<div class="ui">
    <button class="btn active" id="btn-flow">Flow</button>
    <button class="btn" id="btn-pulse">Pulse</button>
    <button class="btn" id="btn-vortex">Vortex</button>
    <button class="btn" id="btn-aurora">Aurora</button>
</div>

<!-- The WebGL Script -->
<script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');

let W, H, t = 0, mode = 0, targetMode = 0, modeBlend = 0;
let mouseX = 0.5, mouseY = 0.5, targetMX = 0.5, targetMY = 0.5;

function resize() {
  W = canvas.width = window.innerWidth * devicePixelRatio;
  H = canvas.height = window.innerHeight * devicePixelRatio;
  gl.viewport(0, 0, W, H);
}
window.addEventListener('resize', resize);

document.addEventListener('mousemove', e => {
  targetMX = e.clientX / window.innerWidth;
  targetMY = 1.0 - e.clientY / window.innerHeight;
});
document.addEventListener('touchmove', e => {
  targetMX = e.touches[0].clientX / window.innerWidth;
  targetMY = 1.0 - e.touches[0].clientY / window.innerHeight;
}, { passive: true });

const buttons = ['flow','pulse','vortex','aurora'];
buttons.forEach((id, i) => {
  document.getElementById('btn-'+id).addEventListener('click', () => {
    targetMode = i;
    document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
    document.getElementById('btn-'+id).classList.add('active');
  });
});

const vert = `
attribute vec2 a_pos;
void main() { gl_Position = vec4(a_pos, 0.0, 1.0); }
`;

const frag = `
precision highp float;
uniform float u_time;
uniform vec2 u_res;
uniform vec2 u_mouse;
uniform float u_mode;

#define PI 3.14159265
#define TAU 6.28318530

float hash(vec2 p) {
  p = fract(p * vec2(127.1, 311.7));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}

float noise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(
    mix(hash(i + vec2(0,0)), hash(i + vec2(1,0)), u.x),
    mix(hash(i + vec2(0,1)), hash(i + vec2(1,1)), u.x),
    u.y
  );
}

float fbm(vec2 p, int oct) {
  float v = 0.0, a = 0.5;
  for(int i = 0; i < 8; i++) {
    if(i >= oct) break;
    v += a * noise(p);
    p = p * 2.1 + vec2(1.3, 0.7);
    a *= 0.5;
  }
  return v;
}

uniform float u_temp;

vec3 blueBlack(float t) {
  // neutral blue-black ramp
  vec3 black     = vec3(0.0,  0.0,  0.02);
  vec3 deepBlue  = vec3(0.03, 0.08, 0.25);
  vec3 midBlue   = vec3(0.06, 0.18, 0.55);
  vec3 brightBlue= vec3(0.15, 0.45, 0.95);
  vec3 iceBlue   = vec3(0.55, 0.80, 1.0);

  vec3 neutral;
  if(t < 0.25) neutral = mix(black,      deepBlue,   t * 4.0);
  else if(t < 0.5) neutral = mix(deepBlue,   midBlue,   (t - 0.25) * 4.0);
  else if(t < 0.75) neutral = mix(midBlue,    brightBlue,(t - 0.5)  * 4.0);
  else neutral = mix(brightBlue, iceBlue,   (t - 0.75) * 4.0);

  // cold (indigo) ramp — shift shadows to deep violet-indigo
  vec3 cBlack    = vec3(0.02, 0.0,  0.08);
  vec3 cDeep     = vec3(0.07, 0.02, 0.30);
  vec3 cMid      = vec3(0.12, 0.05, 0.60);
  vec3 cBright   = vec3(0.25, 0.15, 0.90);
  vec3 cIce      = vec3(0.50, 0.50, 1.0);

  vec3 cold;
  if(t < 0.25) cold = mix(cBlack,  cDeep,   t * 4.0);
  else if(t < 0.5) cold = mix(cDeep,   cMid,   (t - 0.25) * 4.0);
  else if(t < 0.75) cold = mix(cMid,    cBright,(t - 0.5)  * 4.0);
  else cold = mix(cBright, cIce,   (t - 0.75) * 4.0);

  // warm (ice) ramp — push highlights toward near-white cyan-ice
  vec3 wBlack    = vec3(0.0,  0.01, 0.04);
  vec3 wDeep     = vec3(0.02, 0.10, 0.28);
  vec3 wMid      = vec3(0.05, 0.30, 0.65);
  vec3 wBright   = vec3(0.30, 0.65, 0.98);
  vec3 wIce      = vec3(0.82, 0.94, 1.0);

  vec3 warm;
  if(t < 0.25) warm = mix(wBlack,  wDeep,   t * 4.0);
  else if(t < 0.5) warm = mix(wDeep,   wMid,   (t - 0.25) * 4.0);
  else if(t < 0.75) warm = mix(wMid,    wBright,(t - 0.5)  * 4.0);
  else warm = mix(wBright, wIce,   (t - 0.75) * 4.0);

  // u_temp: 0 = full indigo, 0.5 = neutral, 1 = full ice
  vec3 col = mix(cold, neutral, smoothstep(0.0, 0.5, u_temp) * 2.0 - 0.0);
  col = mix(col, warm, smoothstep(0.5, 1.0, u_temp) * 2.0 - (u_temp > 0.5 ? 0.0 : 0.0));

  if(u_temp <= 0.5) {
    col = mix(cold, neutral, u_temp * 2.0);
  } else {
    col = mix(neutral, warm, (u_temp - 0.5) * 2.0);
  }

  return col;
}

// Mode 0: Flow
vec3 modeFlow(vec2 uv, float t, vec2 mouse) {
  vec2 p = uv - 0.5;
  p += (mouse - 0.5) * 0.3;

  float angle = atan(p.y, p.x);
  float len = length(p);

  vec2 q = vec2(
    fbm(uv * 2.5 + vec2(t * 0.12, t * 0.08), 6),
    fbm(uv * 2.5 + vec2(1.7, 9.2) + vec2(t * 0.09, -t * 0.11), 6)
  );
  vec2 r = vec2(
    fbm(uv * 2.0 + 4.0 * q + vec2(1.7, 9.2) + t * 0.07, 6),
    fbm(uv * 2.0 + 4.0 * q + vec2(8.3, 2.8) + t * 0.06, 6)
  );

  float f = fbm(uv * 1.8 + 4.0 * r, 6);
  f = smoothstep(0.0, 1.0, f);

  float mouseInfluence = 1.0 - smoothstep(0.0, 0.5, length(uv - mouse));
  f = mix(f, f * 1.4, mouseInfluence * 0.5);

  return blueBlack(clamp(f, 0.0, 1.0));
}

// Mode 1: Pulse
vec3 modePulse(vec2 uv, float t, vec2 mouse) {
  vec2 p = uv - mouse;
  float d = length(p);

  float rings = 0.0;
  for(int i = 0; i < 5; i++) {
    float fi = float(i);
    float r = 0.15 + fi * 0.12;
    float speed = 0.4 + fi * 0.1;
    float phase = mod(t * speed + fi * 0.4, 1.2) / 1.2;
    float ring = exp(-pow((d - r * phase) * 18.0, 2.0));
    ring *= (1.0 - phase);
    rings += ring * (0.5 + fi * 0.1);
  }

  float base = fbm(uv * 3.0 + t * 0.05, 5) * 0.35;
  float core = exp(-d * d * 5.0) * 0.5;
  float v = clamp(base + rings * 0.7 + core, 0.0, 1.0);

  return blueBlack(v);
}

// Mode 2: Vortex
vec3 modeVortex(vec2 uv, float t, vec2 mouse) {
  vec2 p = uv - mouse;
  float d = length(p);
  float angle = atan(p.y, p.x);

  float spin = angle + d * 8.0 - t * 1.5;
  float v1 = sin(spin * 2.0) * 0.5 + 0.5;
  float v2 = cos(spin * 3.0 + d * 5.0) * 0.5 + 0.5;

  float swirl = fbm(vec2(cos(spin + t * 0.2), sin(spin + t * 0.15)) * 2.0 + d * 3.0, 5);
  float falloff = 1.0 - smoothstep(0.0, 0.65, d);
  float outer = fbm(uv * 2.0 - t * 0.04, 4) * 0.3;

  float v = mix(outer, (v1 * 0.3 + v2 * 0.3 + swirl * 0.4) * falloff + outer, falloff);
  v = clamp(v * 1.1, 0.0, 1.0);

  return blueBlack(v);
}

// Mode 3: Aurora
vec3 modeAurora(vec2 uv, float t, vec2 mouse) {
  float bands = 0.0;
  for(int i = 0; i < 6; i++) {
    float fi = float(i);
    float yOff = 0.3 + fi * 0.08;
    float wave = sin(uv.x * (3.0 + fi * 1.5) + t * (0.3 + fi * 0.1) + fi) * 0.06;
    wave += sin(uv.x * (6.0 + fi) - t * 0.2) * 0.03;
    float mouseWave = sin(uv.x * 4.0 + mouse.x * TAU) * (mouse.y - 0.5) * 0.1;

    float band = exp(-pow((uv.y - yOff - wave - mouseWave) * (10.0 + fi * 3.0), 2.0));
    float brightness = fbm(vec2(uv.x * 2.0 + fi * 3.3, t * 0.15 + fi), 4);
    bands += band * brightness * (0.8 - fi * 0.08);
  }

  float base = fbm(uv * 1.5 + t * 0.03, 4) * 0.15;
  float v = clamp(bands * 0.9 + base, 0.0, 1.0);

  vec3 col = blueBlack(v);
  // aurora tint variation
  float tint = fbm(uv * 3.0 + t * 0.08, 3);
  col = mix(col, col * vec3(0.4, 0.8, 1.2), tint * v * 0.3);
  return col;
}

void main() {
  vec2 uv = gl_FragCoord.xy / u_res;
  uv.y = 1.0 - uv.y;

  float m = u_mode;
  int m0 = int(floor(m));
  int m1 = int(ceil(m));
  float mb = fract(m);

  vec3 col0, col1;

  // Mode 0
  if(m0 == 0) col0 = modeFlow(uv, u_time, u_mouse);
  else if(m0 == 1) col0 = modePulse(uv, u_time, u_mouse);
  else if(m0 == 2) col0 = modeVortex(uv, u_time, u_mouse);
  else col0 = modeAurora(uv, u_time, u_mouse);

  if(m1 == 0) col1 = modeFlow(uv, u_time, u_mouse);
  else if(m1 == 1) col1 = modePulse(uv, u_time, u_mouse);
  else if(m1 == 2) col1 = modeVortex(uv, u_time, u_mouse);
  else col1 = modeAurora(uv, u_time, u_mouse);

  vec3 col = mix(col0, col1, smoothstep(0.0, 1.0, mb));

  // Vignette
  vec2 vp = uv - 0.5;
  float vign = 1.0 - dot(vp, vp) * 1.4;
  col *= clamp(vign, 0.0, 1.0);

  // subtle grain
  float grain = hash(uv + vec2(u_time * 0.01)) * 0.025 - 0.012;
  col += grain;

  gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}
`;

function compileShader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, compileShader(gl.VERTEX_SHADER, vert));
gl.attachShader(prog, compileShader(gl.FRAGMENT_SHADER, frag));
gl.linkProgram(prog);
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'a_pos');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

const uTime  = gl.getUniformLocation(prog, 'u_time');
const uRes   = gl.getUniformLocation(prog, 'u_res');
const uMouse = gl.getUniformLocation(prog, 'u_mouse');
const uMode  = gl.getUniformLocation(prog, 'u_mode');
const uTemp  = gl.getUniformLocation(prog, 'u_temp');

const slider = document.getElementById('temp-slider');
let targetTemp = 0.5, currentTemp = 0.5;
slider.addEventListener('input', () => { targetTemp = slider.value / 100; });

let currentMode = 0.0;

function frame(ts) {
  t = ts * 0.001;
  mouseX += (targetMX - mouseX) * 0.04;
  mouseY += (targetMY - mouseY) * 0.04;

  const target = targetMode;
  if (Math.abs(currentMode - target) > 0.005) {
    currentMode += (target - currentMode) * 0.05;
  } else {
    currentMode = target;
  }

  currentTemp += (targetTemp - currentTemp) * 0.06;

  gl.uniform1f(uTime, t);
  gl.uniform2f(uRes, W, H);
  gl.uniform2f(uMouse, mouseX, mouseY);
  gl.uniform1f(uMode, currentMode);
  gl.uniform1f(uTemp, currentTemp);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  requestAnimationFrame(frame);
}

resize();
requestAnimationFrame(frame);
</script>
</body>
